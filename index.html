<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand-Controlled Webcam Reel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hidden raw webcam video */
    #rawVideo {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 640px;
      height: 480px;
    }

    /* Main display canvas — shows webcam + hand overlay */
    #displayCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0;
      display: block;
    }

    /* HUD overlay */
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* Gesture label */
    #gestureLabel {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      border: 2px solid #00e5ff;
      border-radius: 30px;
      padding: 10px 28px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00e5ff;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity 0.3s;
      text-shadow: 0 0 10px #00e5ff;
    }

    /* Zoom indicator */
    #zoomIndicator {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      border: 2px solid #ff6f00;
      border-radius: 12px;
      padding: 8px 18px;
      font-size: 16px;
      font-weight: 600;
      color: #ff6f00;
    }

    /* Filter label */
    #filterLabel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      border: 2px solid #7c4dff;
      border-radius: 12px;
      padding: 8px 18px;
      font-size: 16px;
      font-weight: 600;
      color: #7c4dff;
    }

    /* Screenshot flash */
    #flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }

    /* Screenshot gallery strip */
    #gallery {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      max-width: 90vw;
      overflow-x: auto;
      padding: 4px;
    }

    #gallery img {
      height: 52px;
      border-radius: 8px;
      border: 2px solid #00e5ff;
      cursor: pointer;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    #gallery img:hover { transform: scale(1.15); }

    /* Controls help */
    #help {
      position: absolute;
      top: 60px;
      left: 20px;
      background: rgba(0,0,0,0.55);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.9;
      color: #ccc;
      max-width: 230px;
    }
    #help b { color: #00e5ff; }
    #help .emoji { font-size: 17px; }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      font-size: 20px;
      color: #00e5ff;
    }

    .spinner {
      width: 60px; height: 60px;
      border: 5px solid #222;
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Swipe arrow anim */
    #swipeArrow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 72px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      text-shadow: 0 0 20px rgba(255,255,255,0.8);
    }

    /* Start button */
    #startBtn {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      color: #fff;
      border: none;
      border-radius: 40px;
      padding: 16px 44px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      z-index: 101;
      box-shadow: 0 4px 30px rgba(0,229,255,0.4);
    }
    #startBtn:hover { opacity: 0.9; transform: translateX(-50%) scale(1.05); }

  </style>
</head>
<body>

<div id="app">
  <!-- Raw webcam feed (hidden) -->
  <video id="rawVideo" autoplay playsinline muted></video>

  <!-- Main rendered canvas -->
  <canvas id="displayCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="gestureLabel">✋ Show your hand</div>
    <div id="zoomIndicator">🔍 Zoom: 1.0×</div>
    <div id="filterLabel">🎨 Normal</div>
    <div id="flash"></div>
    <div id="swipeArrow"></div>
    <div id="gallery"></div>
    <div id="help">
      <b>✋ Hand Gestures</b><br>
      <span class="emoji">👋</span> <b>Open palm</b> — Normal<br>
      <span class="emoji">✊</span> <b>Fist</b> — 📸 Capture photo<br>
      <span class="emoji">☝️</span> <b>Point up</b> — Zoom In<br>
      <span class="emoji">👇</span> <b>Point down</b> — Zoom Out<br>
      <span class="emoji">👈</span> <b>Swipe left</b> — Prev filter<br>
      <span class="emoji">👉</span> <b>Swipe right</b> — Next filter<br>
      <span class="emoji">🤏</span> <b>Pinch</b> — Fine zoom<br>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading Hand AI model…</div>
  </div>
  <button id="startBtn" style="display:none">🎬 Start Camera</button>
</div>

<!-- MediaPipe via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
const FILTERS = ['Normal','Greyscale','Sepia','Invert','Warm','Cool','Vignette','Sketch'];
let filterIndex = 0;
let zoomLevel   = 1.0;
const ZOOM_MIN  = 0.5, ZOOM_MAX = 4.0, ZOOM_STEP = 0.04;

let lastGesture   = '';
let gestureTimer  = null;
let captureReady  = true;
let lastHandX     = null;
let swipeBlocked  = false;

let pinchPrev     = null;
let prevIndexTipY = null;

// ─────────────────────────────────────────────────────────────
// DOM refs
// ─────────────────────────────────────────────────────────────
const video          = document.getElementById('rawVideo');
const displayCanvas  = document.getElementById('displayCanvas');
const ctx            = displayCanvas.getContext('2d');
const gestureLabel   = document.getElementById('gestureLabel');
const zoomIndicator  = document.getElementById('zoomIndicator');
const filterLabel    = document.getElementById('filterLabel');
const flash          = document.getElementById('flash');
const swipeArrow     = document.getElementById('swipeArrow');
const gallery        = document.getElementById('gallery');
const loading        = document.getElementById('loading');
const startBtn       = document.getElementById('startBtn');

// ─────────────────────────────────────────────────────────────
// Resize canvas to window
// ─────────────────────────────────────────────────────────────
function resizeCanvas() {
  displayCanvas.width  = window.innerWidth;
  displayCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ─────────────────────────────────────────────────────────────
// Gesture detection helpers
// ─────────────────────────────────────────────────────────────
function fingerExtended(lm, tip, pip) {
  return lm[tip].y < lm[pip].y;
}

function detectGesture(landmarks) {
  const lm = landmarks;

  // Finger states
  const thumbOpen  = lm[4].x < lm[3].x;  // rough for left hand
  const indexUp    = fingerExtended(lm, 8, 6);
  const middleUp   = fingerExtended(lm, 12, 10);
  const ringUp     = fingerExtended(lm, 16, 14);
  const pinkyUp    = fingerExtended(lm, 20, 18);

  const extCount = [indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

  // Fist
  if (!indexUp && !middleUp && !ringUp && !pinkyUp) return 'FIST';

  // Open palm
  if (indexUp && middleUp && ringUp && pinkyUp) return 'OPEN';

  // Point up — only index
  if (indexUp && !middleUp && !ringUp && !pinkyUp) {
    const dy = lm[8].y - lm[5].y;
    if (dy < -0.08) return 'POINT_UP';
    if (dy > 0.05)  return 'POINT_DOWN';
    return 'POINT';
  }

  // Peace — index + middle only
  if (indexUp && middleUp && !ringUp && !pinkyUp) return 'PEACE';

  // Pinch — thumb & index close together, others down
  const dist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
  if (dist < 0.06 && !middleUp && !ringUp && !pinkyUp) return 'PINCH';

  return 'UNKNOWN';
}

// ─────────────────────────────────────────────────────────────
// Filter rendering
// ─────────────────────────────────────────────────────────────
function applyFilter(imgData, filter) {
  const d = imgData.data;
  switch(filter) {
    case 'Greyscale':
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        d[i] = d[i+1] = d[i+2] = g;
      }
      break;
    case 'Sepia':
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        d[i]   = Math.min(255, r*0.393 + g*0.769 + b*0.189);
        d[i+1] = Math.min(255, r*0.349 + g*0.686 + b*0.168);
        d[i+2] = Math.min(255, r*0.272 + g*0.534 + b*0.131);
      }
      break;
    case 'Invert':
      for (let i = 0; i < d.length; i += 4) {
        d[i]   = 255 - d[i];
        d[i+1] = 255 - d[i+1];
        d[i+2] = 255 - d[i+2];
      }
      break;
    case 'Warm':
      for (let i = 0; i < d.length; i += 4) {
        d[i]   = Math.min(255, d[i]   * 1.15);
        d[i+1] = Math.min(255, d[i+1] * 1.05);
        d[i+2] = Math.min(255, d[i+2] * 0.85);
      }
      break;
    case 'Cool':
      for (let i = 0; i < d.length; i += 4) {
        d[i]   = Math.min(255, d[i]   * 0.85);
        d[i+1] = Math.min(255, d[i+1] * 1.02);
        d[i+2] = Math.min(255, d[i+2] * 1.2);
      }
      break;
    case 'Vignette': {
      const W = imgData.width, H = imgData.height;
      const cx = W/2, cy = H/2;
      const maxR = Math.sqrt(cx*cx + cy*cy);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y*W + x)*4;
          const r = Math.sqrt((x-cx)**2 + (y-cy)**2);
          const v = 1 - Math.pow(r/maxR, 1.5) * 0.8;
          d[i]   *= v; d[i+1] *= v; d[i+2] *= v;
        }
      }
      break;
    }
    case 'Sketch':
      // Edge-detect (Sobel-ish via greyscale inversion)
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        const e = Math.max(0, 255 - g*2.5);
        d[i] = d[i+1] = d[i+2] = e;
      }
      break;
  }
  return imgData;
}

// ─────────────────────────────────────────────────────────────
// Render frame to display canvas (mirrored + zoomed + filtered)
// ─────────────────────────────────────────────────────────────
function renderFrame(videoEl, handResults) {
  const W = displayCanvas.width, H = displayCanvas.height;
  const vW = videoEl.videoWidth  || 640;
  const vH = videoEl.videoHeight || 480;

  ctx.save();

  // Mirror horizontally
  ctx.translate(W, 0);
  ctx.scale(-1, 1);

  // Zoom: crop center
  const scale  = zoomLevel;
  const srcW   = vW / scale;
  const srcH   = vH / scale;
  const srcX   = (vW - srcW) / 2;
  const srcY   = (vH - srcH) / 2;

  // Draw video to offscreen to allow pixel manipulation
  const off = document.createElement('canvas');
  off.width = vW; off.height = vH;
  const octx = off.getContext('2d');
  octx.drawImage(videoEl, 0, 0, vW, vH);

  // Apply filter
  const filter = FILTERS[filterIndex];
  if (filter !== 'Normal') {
    const imgData = octx.getImageData(0, 0, vW, vH);
    applyFilter(imgData, filter);
    octx.putImageData(imgData, 0, 0);
  }

  ctx.drawImage(off, srcX, srcY, srcW, srcH, 0, 0, W, H);

  ctx.restore();

  // Draw hand skeleton on top (also mirrored)
  if (handResults && handResults.multiHandLandmarks) {
    for (const lms of handResults.multiHandLandmarks) {
      drawHand(lms, W, H);
    }
  }
}

// ─────────────────────────────────────────────────────────────
// Draw hand skeleton
// ─────────────────────────────────────────────────────────────
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

function drawHand(lms, W, H) {
  ctx.save();
  // Connections
  ctx.strokeStyle = 'rgba(0,229,255,0.8)';
  ctx.lineWidth = 2.5;
  for (const [a,b] of CONNECTIONS) {
    const ax = (1 - lms[a].x) * W, ay = lms[a].y * H;
    const bx = (1 - lms[b].x) * W, by = lms[b].y * H;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
  }
  // Landmarks
  for (const lm of lms) {
    const x = (1 - lm.x) * W, y = lm.y * H;
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────
// Show gesture label
// ─────────────────────────────────────────────────────────────
const GESTURE_LABELS = {
  FIST:       '✊ Capture!',
  OPEN:       '✋ Open Palm',
  POINT_UP:   '☝️ Zoom In',
  POINT_DOWN: '👇 Zoom Out',
  POINT:      '👆 Pointing',
  PEACE:      '✌️ Peace',
  PINCH:      '🤏 Pinch Zoom',
  UNKNOWN:    '🤔 …',
  SWIPE_L:    '👈 Prev Filter',
  SWIPE_R:    '👉 Next Filter',
};

function showGesture(g) {
  gestureLabel.textContent = GESTURE_LABELS[g] || g;
  clearTimeout(gestureTimer);
  gestureTimer = setTimeout(() => {
    gestureLabel.textContent = '✋ Show your hand';
  }, 1500);
}

// ─────────────────────────────────────────────────────────────
// Take screenshot
// ─────────────────────────────────────────────────────────────
function takeScreenshot() {
  if (!captureReady) return;
  captureReady = false;

  // Flash effect
  flash.style.opacity = '0.9';
  setTimeout(() => { flash.style.opacity = '0'; }, 120);

  // Save thumbnail
  const thumb = document.createElement('canvas');
  thumb.width  = displayCanvas.width;
  thumb.height = displayCanvas.height;
  thumb.getContext('2d').drawImage(displayCanvas, 0, 0);
  const url = thumb.toDataURL('image/jpeg', 0.85);

  const img = document.createElement('img');
  img.src = url;
  img.title = 'Click to download';
  img.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = url;
    a.download = `handcam_${Date.now()}.jpg`;
    a.click();
  });
  gallery.prepend(img);

  // Cooldown
  setTimeout(() => { captureReady = true; }, 1500);
}

// ─────────────────────────────────────────────────────────────
// Show swipe arrow
// ─────────────────────────────────────────────────────────────
function showSwipe(dir) {
  swipeArrow.textContent = dir === 'L' ? '👈' : '👉';
  swipeArrow.style.opacity = '1';
  setTimeout(() => { swipeArrow.style.opacity = '0'; }, 600);
}

// ─────────────────────────────────────────────────────────────
// MediaPipe Hands
// ─────────────────────────────────────────────────────────────
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6,
});

let lastHandResults = null;

hands.onResults(results => {
  lastHandResults = results;

  renderFrame(video, results);

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    lastHandX   = null;
    pinchPrev   = null;
    swipeBlocked = false;
    return;
  }

  const lms     = results.multiHandLandmarks[0];
  const gesture = detectGesture(lms);

  // ── Pinch zoom ──────────────────────────────────────────
  if (gesture === 'PINCH') {
    const dist = Math.hypot(lms[4].x - lms[8].x, lms[4].y - lms[8].y);
    if (pinchPrev !== null) {
      const delta = (dist - pinchPrev) * 8;
      zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomLevel + delta));
      zoomIndicator.textContent = `🔍 Zoom: ${zoomLevel.toFixed(1)}×`;
    }
    pinchPrev = dist;
    showGesture('PINCH');
    lastHandX = null;
    return;
  }
  pinchPrev = null;

  // ── Point zoom ──────────────────────────────────────────
  if (gesture === 'POINT_UP') {
    zoomLevel = Math.min(ZOOM_MAX, zoomLevel + ZOOM_STEP);
    zoomIndicator.textContent = `🔍 Zoom: ${zoomLevel.toFixed(1)}×`;
    showGesture('POINT_UP');
    lastHandX = null;
    return;
  }
  if (gesture === 'POINT_DOWN') {
    zoomLevel = Math.max(ZOOM_MIN, zoomLevel - ZOOM_STEP);
    zoomIndicator.textContent = `🔍 Zoom: ${zoomLevel.toFixed(1)}×`;
    showGesture('POINT_DOWN');
    lastHandX = null;
    return;
  }

  // ── Fist → capture ──────────────────────────────────────
  if (gesture === 'FIST') {
    showGesture('FIST');
    takeScreenshot();
    lastHandX = null;
    return;
  }

  // ── Open palm → swipe detection ─────────────────────────
  if (gesture === 'OPEN') {
    showGesture('OPEN');
    const palmX = lms[9].x;   // middle knuckle

    if (lastHandX !== null && !swipeBlocked) {
      const dx = lastHandX - palmX;  // mirrored: positive = hand moved right on screen = swipe right
      if (Math.abs(dx) > 0.08) {
        swipeBlocked = true;
        if (dx > 0) {
          // Swipe right → next filter
          filterIndex = (filterIndex + 1) % FILTERS.length;
          filterLabel.textContent = `🎨 ${FILTERS[filterIndex]}`;
          showGesture('SWIPE_R');
          showSwipe('R');
        } else {
          // Swipe left → prev filter
          filterIndex = (filterIndex - 1 + FILTERS.length) % FILTERS.length;
          filterLabel.textContent = `🎨 ${FILTERS[filterIndex]}`;
          showGesture('SWIPE_L');
          showSwipe('L');
        }
        lastHandX = null;
        setTimeout(() => { swipeBlocked = false; }, 700);
        return;
      }
    }
    lastHandX = palmX;
    return;
  }

  // ── Peace → reset zoom ───────────────────────────────────
  if (gesture === 'PEACE') {
    zoomLevel = 1.0;
    zoomIndicator.textContent = `🔍 Zoom: 1.0×`;
    showGesture('PEACE');
    return;
  }

  lastHandX = null;
  showGesture(gesture);
});

// ─────────────────────────────────────────────────────────────
// Camera loop
// ─────────────────────────────────────────────────────────────
let mpCamera;

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' },
    audio: false
  });
  video.srcObject = stream;
  await video.play();

  mpCamera = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 640,
    height: 480
  });
  mpCamera.start();
}

// ─────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  // Pre-load MediaPipe model
  await hands.initialize();
  loading.style.display = 'none';
  startBtn.style.display = 'block';

  startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    await startCamera();
  });
});
</script>
</body>
</html>
